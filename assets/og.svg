<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0b0d"/>
  <!-- faint top glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4be3ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4be3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- lane border -->
  <rect x="24" y="24" width="1152" height="582" rx="10" fill="none" stroke="#2a2e35" stroke-width="4"/>
  <!-- lane markings -->
  <line x1="72" y1="516" x2="1128" y2="516" stroke="#ffb03a" stroke-width="10" stroke-dasharray="46 34" opacity="0.30"/>
  <!-- eyebrow -->
  <text x="74" y="132" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#868d99">GHOSTDRIVER.NET</text>
  <!-- title -->
  <text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="800" letter-spacing="0">
    <tspan fill="#ffb03a">GHOST</tspan><tspan fill="#4be3ff"> DRIVER</tspan>
  </text>
  <!-- subtitle -->
  <text x="74" y="398" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" fill="#f2f4f7">Roblox codes, best cars &amp; cash guides</text>
  <!-- working-codes pill -->
  <rect x="74" y="440" width="516" height="70" rx="12" fill="none" stroke="#3ef2a0" stroke-width="3"/>
  <circle cx="112" cy="475" r="9" fill="#3ef2a0"/>
  <text x="134" y="487" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="#3ef2a0">WORKING CODES INSIDE</text>
</svg>
