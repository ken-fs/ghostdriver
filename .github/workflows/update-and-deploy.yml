name: Refresh stats

# Refreshes live Roblox traction and commits it. Deployment is deploy.yml (GitHub Actions,
# 2026-11-03: Cloudflare's Git integration builds kept failing). A push made with GITHUB_TOKEN
# does not trigger other workflows, so after committing we dispatch deploy.yml explicitly.

on:
  schedule:
    - cron: "0 1 * * *" # once a day, 01:00 UTC = 09:00 Beijing (2026-11-03: was every 6h; daily is enough, the site has little data)
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow committing refreshed stats.json
      actions: write # allow dispatching deploy.yml after a stats commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull live traction from Roblox and write src/data/stats.json.
      # Bails without writing if the API is malformed, so a bad run is a no-op.
      - name: Refresh stats
        run: node scripts/refresh-stats.mjs

      - name: Commit refreshed stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/stats.json; then
            git add src/data/stats.json
            git commit -m "chore: refresh Ghost Driver stats"
            git push
            gh workflow run deploy.yml --ref main
          else
            echo "No stats change."
          fi

      # Ping Bing & co. whenever the site content may have changed.
      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
