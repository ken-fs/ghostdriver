name: Refresh stats

# Deployment is handled by Cloudflare's Git integration (Workers Builds) on push.
# This workflow only refreshes live Roblox traction and commits it — the commit's
# push then triggers Cloudflare to rebuild & redeploy automatically.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow committing refreshed stats.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull live traction from Roblox and write src/data/stats.json.
      # Bails without writing if the API is malformed, so a bad run is a no-op.
      - name: Refresh stats
        run: node scripts/refresh-stats.mjs

      - name: Commit refreshed stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/stats.json; then
            git add src/data/stats.json
            git commit -m "chore: refresh Ghost Driver stats"
            git push
          else
            echo "No stats change."
          fi
