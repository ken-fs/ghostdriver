# Push to main → build → wrangler deploy. Generated by Ship/scripts/setup-gh-deploy.py.
# Stands in for Cloudflare's dashboard-only Git integration. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          SITE_URL: https://ghostdriver.net
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_ADSTERRA_SLOT_HOMEPAGE_300X250: ${{ vars.PUBLIC_ADSTERRA_SLOT_HOMEPAGE_300X250 }}
          PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90: ${{ vars.PUBLIC_ADSTERRA_SLOT_INCONTENT_728X90 }}

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live deploy marker
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://ghostdriver.net/.well-known/anvilwiki-deploy.txt?ci=$GITHUB_RUN_ID-$i" | tr -d '\n')
            [ "$live" = "$GITHUB_SHA" ] && echo "live = $live" && exit 0
            sleep 10
          done
          echo "live marker '$live' != $GITHUB_SHA"; exit 1
